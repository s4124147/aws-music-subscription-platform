<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register – Music App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 40px 36px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #1a1a2e;
      font-size: 24px;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #444;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 18px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #4f46e5; }
    button {
      width: 100%;
      padding: 11px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    #msg {
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }
    .error   { color: #dc2626; }
    .success { color: #16a34a; }
    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #555;
    }
    .login-link a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: bold;
    }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <h1>🎵 Music App</h1>
  <p class="subtitle">Create a new account</p>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="your@email.com">

  <label for="username">Username</label>
  <input type="text" id="username" placeholder="Your name">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Enter password"
         onkeydown="if(event.key==='Enter') register()">

  <button id="reg-btn" onclick="register()">Register</button>
  <div id="msg"></div>

  <div class="login-link">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script>
  const API_BASE = window.APP_CONFIG?.API_BASE || "http://localhost:5000";

  async function register() {
    const email    = document.getElementById("email").value.trim();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const msgEl    = document.getElementById("msg");
    const btn      = document.getElementById("reg-btn");

    msgEl.textContent = "";
    msgEl.className   = "";

    if (!email || !username || !password) {
      msgEl.textContent = "Please fill in all fields.";
      msgEl.className   = "error";
      return;
    }

    btn.disabled    = true;
    btn.textContent = "Registering...";

    try {
      const res = await fetch(`${API_BASE}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, user_name: username, password })
      });

      const data = await res.json();

      if (res.status === 409 || (data.message && data.message.toLowerCase().includes("exist"))) {
        msgEl.textContent = "The email already exists";
        msgEl.className   = "error";
      } else if (res.ok) {
        msgEl.textContent = "Registered successfully! Redirecting to login...";
        msgEl.className   = "success";
        setTimeout(() => { window.location.href = "login.html"; }, 1500);
      } else {
        msgEl.textContent = data.message || "Registration failed. Please try again.";
        msgEl.className   = "error";
      }
    } catch (err) {
      msgEl.textContent = "Error connecting to server.";
      msgEl.className   = "error";
    } finally {
      btn.disabled    = false;
      btn.textContent = "Register";
    }
  }
</script>

</body>
</html>
